# Free Supabase projects pause after a week without activity.
# This pings the game backend every 3 days so it's always ready to play.
name: Keep game backend awake

on:
  schedule:
    - cron: '17 9 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://zjhihjhrbmasfshjalxc.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_W3x_7QAjOtT0cfEy9cwpqg__oaXJx7k" \
            -H "Content-Type: application/json" -d '{}'

      # GitHub switches off scheduled workflows in repos with no activity for 60 days.
      # A tiny monthly commit keeps this one running.
      - name: Monthly heartbeat commit
        run: |
          if [ "$(date -u +%d)" -le 03 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat.txt
            git config user.name "keepalive-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/heartbeat.txt
            git commit -m "chore: keep-alive heartbeat" || exit 0
            git push
          fi
